<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Placeholder - reception area">
  <!-- ============================================================
       PLACEHOLDER 1 - RECEPCION
       IMAGEN DE RELLENO. Reemplazar con una foto real de la
       recepcion de la clinica (horizontal, ~1600x900).
       Se cambia desde el panel admin -> Banner Photos.
       ============================================================ -->
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12283c"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#b1)"/>

  <!-- Piso -->
  <line x1="0" y1="640" x2="1600" y2="640" stroke="#2dd4bf" stroke-width="3" opacity="0.25"/>

  <!-- Mostrador de recepcion -->
  <g opacity="0.5">
    <rect x="520" y="470" width="560" height="170" rx="14" fill="none" stroke="#2dd4bf" stroke-width="5"/>
    <line x1="520" y1="520" x2="1080" y2="520" stroke="#2dd4bf" stroke-width="4"/>
  </g>

  <!-- Pared trasera con paneles -->
  <g opacity="0.25" stroke="#9db2c2" stroke-width="4" fill="none">
    <rect x="360" y="180" width="180" height="250" rx="10"/>
    <rect x="1060" y="180" width="180" height="250" rx="10"/>
  </g>

  <!-- Lamparas -->
  <g opacity="0.4" fill="#4d8fd6">
    <circle cx="640" cy="150" r="16"/>
    <circle cx="800" cy="130" r="16"/>
    <circle cx="960" cy="150" r="16"/>
  </g>

  <!-- Etiqueta -->
  <text x="800" y="770" text-anchor="middle" fill="#9db2c2" opacity="0.75"
        font-family="Arial, Helvetica, sans-serif" font-size="34" letter-spacing="4">
    PLACEHOLDER - REPLACE WITH REAL PHOTO
  </text>
  <text x="800" y="820" text-anchor="middle" fill="#2dd4bf" opacity="0.6"
        font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="2">
    Reception / Waiting area
  </text>
</svg>
