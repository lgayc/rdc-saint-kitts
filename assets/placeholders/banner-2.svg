<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Placeholder - imaging equipment">
  <!-- ============================================================
       PLACEHOLDER 2 - SALA DE EQUIPOS
       IMAGEN DE RELLENO. Reemplazar con una foto real de la sala
       de MRI o CT (horizontal, ~1600x900).
       Se cambia desde el panel admin -> Banner Photos.
       Version clara, a juego con el tema del sitio.
       ============================================================ -->
  <defs>
    <radialGradient id="b2" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e1e9ef"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#b2)"/>

  <!-- Equipo tipo MRI de frente -->
  <g opacity="0.6">
    <rect x="500" y="230" width="600" height="400" rx="70" fill="none" stroke="#3b7fc4" stroke-width="6"/>
    <circle cx="800" cy="430" r="150" fill="none" stroke="#3b7fc4" stroke-width="6"/>
    <circle cx="800" cy="430" r="96" fill="none" stroke="#12a594" stroke-width="5"/>
  </g>

  <!-- Camilla -->
  <g opacity="0.5">
    <rect x="640" y="640" width="480" height="26" rx="13" fill="#12a594"/>
    <rect x="700" y="666" width="26" height="60" rx="8" fill="#5b6d7c"/>
    <rect x="1030" y="666" width="26" height="60" rx="8" fill="#5b6d7c"/>
  </g>

  <!-- Luces de techo -->
  <g opacity="0.28" stroke="#5b6d7c" stroke-width="6" stroke-linecap="round">
    <line x1="380" y1="120" x2="620" y2="120"/>
    <line x1="980" y1="120" x2="1220" y2="120"/>
  </g>

  <!-- Etiqueta -->
  <text x="800" y="790" text-anchor="middle" fill="#5b6d7c" opacity="0.85"
