<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Ultrasound">
  <!-- ============================================================
       ULTRASOUND  ·  marca abstracta
       ------------------------------------------------------------
       Idea: ondas concentricas que se abren desde un punto y se
       van desvaneciendo. Es la lectura mas directa de "sonido
       que viaja y rebota", sin dibujar el aparato.
       ============================================================ -->
  <rect width="400" height="340" fill="none"/>

  <!-- Ondas: mismo centro, radios crecientes, opacidad decreciente -->
  <g fill="none" stroke="#3b7fc4" stroke-linecap="round">
    <path d="M144 118 A 60 60 0 0 0 256 118"  stroke-width="9" opacity="0.95"/>
    <path d="M124 152 A 92 92 0 0 0 276 152"  stroke-width="8" opacity="0.68"/>
    <path d="M106 188 A 124 124 0 0 0 294 188" stroke-width="7" opacity="0.44"/>
    <path d="M90 226 A 156 156 0 0 0 310 226"  stroke-width="6" opacity="0.26"/>
    <path d="M76 264 A 188 188 0 0 0 324 264"  stroke-width="5" opacity="0.14"/>
  </g>

  <!-- Origen de la onda -->
  <circle cx="200" cy="96" r="15" fill="#12a594"/>
  <circle cx="200" cy="96" r="27" fill="none" stroke="#12a594" stroke-width="3" opacity="0.35"/>
</svg>
