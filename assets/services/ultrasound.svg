<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ultrasound">
  <!-- ============================================================
       ULTRASOUND (incl. 3D/4D)
       Transductor apoyado arriba, cono de sonido abriendose hacia
       abajo, y dentro las ondas del eco.
       ============================================================ -->
  <defs>
    <linearGradient id="usCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d8fd6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4d8fd6" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="usClip">
      <path d="M186 78 L214 78 L322 246 L78 246 Z"/>
    </clipPath>
  </defs>

  <rect width="400" height="300" fill="#eef2f5"/>

  <!-- Cono de exploracion -->
  <path d="M186 78 L214 78 L322 246 L78 246 Z" fill="url(#usCone)"/>

  <!-- Ondas del eco, recortadas al cono -->
  <g clip-path="url(#usClip)" fill="none" stroke="#4d8fd6" stroke-width="2.6" opacity="0.75">
    <path d="M60 128 A 145 145 0 0 0 340 128" transform="translate(0,-6)"/>
    <path d="M40 168 A 175 175 0 0 0 360 168" transform="translate(0,-6)"/>
    <path d="M20 208 A 205 205 0 0 0 380 208" transform="translate(0,-6)"/>
  </g>

  <!-- Punto de interes dentro del cono -->
  <circle cx="200" cy="186" r="26" fill="none" stroke="#2dd4bf" stroke-width="3.5"/>
  <circle cx="200" cy="186" r="7" fill="#2dd4bf"/>

  <!-- Transductor -->
  <g fill="#0a1420">
    <rect x="178" y="30" width="44" height="46" rx="10"/>
    <rect x="186" y="72" width="28" height="8" rx="4"/>
  </g>
  <!-- Cable -->
  <path d="M200 30 C200 8 246 14 268 22" fill="none" stroke="#0a1420" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Linea de piel -->
  <line x1="70" y1="80" x2="330" y2="80" stroke="#0a1420" stroke-width="3" stroke-linecap="round" opacity="0.28"/>
</svg>
