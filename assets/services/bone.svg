<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-label="Bone Densitometry (DEXA)">
  <title>Bone Densitometry (DEXA)</title>

  <!-- Bone Densitometry (DEXA)
       Camilla con el brazo explorador pasando por encima. Las tres
       barras de densidad son la medida, y por eso van en color.

       Set de seis iconos con el mismo vocabulario: trazo de 6,
       extremos redondeados, tinta #0e1c28 para el equipo y
       #12a594 solo para lo que el equipo emite o mide. Un unico
       acento por icono; si se colorea todo, ninguno destaca.

       Nota para quien edite estos archivos: en XML esta PROHIBIDO
       poner dos guiones seguidos dentro de un comentario. Los seis
       archivos de esta carpeta estuvieron rotos por eso y el
       navegador no mostraba ninguno. -->

  <g fill="none" stroke="#0e1c28" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 28h96"/>
    <path d="M152 28v112"/>
    <path d="M92 28v18"/>
    <rect x="70" y="46" width="44" height="18" rx="8"/>
    <path d="M78 88h56M70 106h72M84 124h44"
          stroke="#12a594" stroke-width="7"/>
    <rect x="34" y="140" width="128" height="16" rx="8"/>
    <path d="M52 156v18M144 156v18"/>
  </g>
</svg>
