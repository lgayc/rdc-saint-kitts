<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Bone Densitometry (DEXA)">
  <!-- ============================================================
       BONE DENSITOMETRY (DEXA)  ·  marca abstracta
       ------------------------------------------------------------
       Idea: barras apiladas con densidad decreciente, y una linea
       de referencia. El estudio mide densidad, asi que la marca
       ES una lectura de densidad, no un hueso dibujado.
       ============================================================ -->
  <rect width="400" height="340" fill="none"/>

  <!-- Barras: mismo ancho, opacidad y grosor descendentes -->
  <g fill="#0e1c28">
    <rect x="118" y="86"  width="164" height="26" rx="13" opacity="0.92"/>
    <rect x="118" y="124" width="164" height="26" rx="13" opacity="0.72"/>
    <rect x="118" y="162" width="164" height="26" rx="13" opacity="0.52"/>
    <rect x="118" y="200" width="164" height="26" rx="13" opacity="0.32"/>
    <rect x="118" y="238" width="164" height="26" rx="13" opacity="0.16"/>
  </g>

  <!-- Umbral de referencia -->
  <line x1="90" y1="181" x2="310" y2="181"
        stroke="#12a594" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="2 16"/>

  <!-- Marcador de lectura sobre el umbral -->
  <circle cx="300" cy="181" r="13" fill="#12a594"/>
  <circle cx="300" cy="181" r="24" fill="none" stroke="#12a594" stroke-width="3" opacity="0.3"/>
</svg>
