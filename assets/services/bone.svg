<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bone Densitometry (DEXA)">
  <!-- ============================================================
       BONE DENSITOMETRY (DEXA)
       Columna lumbar vista de frente sobre la mesa de escaneo, con
       el brazo del escaner pasando y una barra de densidad.
       ============================================================ -->
  <defs>
    <linearGradient id="dexaScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dexaBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#e07a7a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#eef2f5"/>

  <!-- Mesa -->
  <rect x="60" y="196" width="280" height="16" rx="8" fill="#0a1420" opacity="0.85"/>
  <rect x="84" y="212" width="18" height="28" rx="5" fill="#0a1420" opacity="0.45"/>
  <rect x="298" y="212" width="18" height="28" rx="5" fill="#0a1420" opacity="0.45"/>

  <!-- Haz del escaner -->
  <path d="M172 64 L228 64 L252 194 L148 194 Z" fill="url(#dexaScan)"/>

  <!-- Brazo del escaner -->
  <rect x="152" y="42" width="96" height="22" rx="8" fill="#0a1420"/>
  <line x1="200" y1="26" x2="200" y2="42" stroke="#0a1420" stroke-width="5" stroke-linecap="round"/>

  <!-- Vertebras lumbares -->
  <g fill="none" stroke="#0a1420" stroke-width="3.4" stroke-linecap="round">
    <rect x="176" y="86"  width="48" height="22" rx="7"/>
    <rect x="174" y="114" width="52" height="22" rx="7"/>
    <rect x="172" y="142" width="56" height="22" rx="7"/>
    <rect x="174" y="170" width="52" height="20" rx="7"/>
  </g>

  <!-- Apofisis laterales -->
  <g stroke="#4d8fd6" stroke-width="3.2" stroke-linecap="round" opacity="0.7">
    <line x1="176" y1="97"  x2="156" y2="93"/>
    <line x1="224" y1="97"  x2="244" y2="93"/>
    <line x1="174" y1="125" x2="152" y2="121"/>
    <line x1="226" y1="125" x2="248" y2="121"/>
    <line x1="172" y1="153" x2="150" y2="149"/>
    <line x1="228" y1="153" x2="250" y2="149"/>
  </g>

  <!-- Escala de densidad -->
  <rect x="286" y="96" width="18" height="82" rx="9" fill="url(#dexaBar)"/>
  <g stroke="#0a1420" stroke-width="2.6" stroke-linecap="round" opacity="0.6">
    <line x1="310" y1="104" x2="320" y2="104"/>
    <line x1="310" y1="137" x2="320" y2="137"/>
    <line x1="310" y1="170" x2="320" y2="170"/>
  </g>
  <!-- Marcador de lectura -->
  <circle cx="295" cy="120" r="7" fill="#eef2f5" stroke="#0a1420" stroke-width="3"/>
</svg>
