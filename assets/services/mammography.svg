<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Mammography">
  <!-- ============================================================
       MAMMOGRAPHY  ·  marca abstracta
       ------------------------------------------------------------
       Idea: dos placas que se acercan y, entre ellas, una forma
       de lente. Comunica la compresion suave del estudio sin
       ilustrar anatomia, que en un sitio publico es preferible.
       ============================================================ -->
  <defs>
    <linearGradient id="mgLens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#12a594" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#12a594" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="400" height="340" fill="none"/>

  <!-- Placa superior -->
  <rect x="92" y="104" width="216" height="12" rx="6" fill="#0e1c28"/>

  <!-- Zona de estudio: forma de lente entre las placas -->
  <path d="M124 132 Q200 96 276 132 Q200 244 124 132 Z"
        fill="url(#mgLens)"/>
  <path d="M124 132 Q200 96 276 132 Q200 244 124 132 Z"
        fill="none" stroke="#12a594" stroke-width="7" stroke-linejoin="round"/>

  <!-- Placa inferior -->
  <rect x="92" y="224" width="216" height="12" rx="6" fill="#0e1c28"/>

  <!-- Flechas de compresion, muy discretas -->
  <g stroke="#3b7fc4" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <line x1="200" y1="76" x2="200" y2="96"/>
    <line x1="200" y1="244" x2="200" y2="264"/>
  </g>
</svg>
