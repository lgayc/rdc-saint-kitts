<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-label="Mammography">
  <title>Mammography</title>

  <!-- Mammography
       Las dos placas y, entre ellas, la forma que comprimen. La
       distancia corta entre placas es la lectura de todo el icono.

       Set de seis iconos con el mismo vocabulario: trazo de 6,
       extremos redondeados, tinta #0e1c28 para el equipo y
       #12a594 solo para lo que el equipo emite o mide. Un unico
       acento por icono; si se colorea todo, ninguno destaca.

       Nota para quien edite estos archivos: en XML esta PROHIBIDO
       poner dos guiones seguidos dentro de un comentario. Los seis
       archivos de esta carpeta estuvieron rotos por eso y el
       navegador no mostraba ninguno. -->

  <g fill="none" stroke="#0e1c28" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 174V32"/>
    <path d="M28 174h32"/>
    <path d="M44 48h44"/>
    <path d="M88 48v34"/>
    <path d="M76 88h80" stroke-width="10"/>
    <path d="M92 110c14-15 40-15 54 0" stroke="#12a594"/>
    <path d="M76 132h80" stroke-width="10"/>
  </g>
</svg>
