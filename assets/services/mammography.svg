<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Mammography">
  <!-- ============================================================
       MAMMOGRAPHY
       Vista lateral del mamografo: columna vertical, brazo con el
       emisor arriba, placa de compresion y detector abajo.
       ============================================================ -->
  <defs>
    <linearGradient id="mgBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#eef2f5"/>

  <!-- Columna del equipo -->
  <rect x="88" y="40" width="26" height="216" rx="8" fill="#0a1420" opacity="0.85"/>
  <rect x="70" y="256" width="62" height="14" rx="7" fill="#0a1420"/>

  <!-- Cabezal emisor -->
  <rect x="114" y="52" width="150" height="34" rx="10" fill="#0a1420"/>
  <rect x="176" y="86" width="34" height="12" rx="4" fill="#0a1420" opacity="0.7"/>

  <!-- Haz -->
  <path d="M178 98 L208 98 L246 176 L140 176 Z" fill="url(#mgBeam)"/>

  <!-- Placa de compresion (superior) -->
  <rect x="132" y="148" width="140" height="10" rx="5" fill="#4d8fd6" opacity="0.75"/>

  <!-- Zona de examen -->
  <path d="M150 158 C150 176 176 190 206 190 C238 190 260 178 262 162 L262 158 Z"
        fill="#2dd4bf" opacity="0.22"/>

  <!-- Detector (inferior) -->
  <rect x="120" y="190" width="164" height="18" rx="6" fill="#0a1420"/>
  <rect x="114" y="176" width="176" height="14" rx="6" fill="#0a1420" opacity="0.35"/>

  <!-- Panel de control -->
  <g opacity="0.5">
    <rect x="298" y="150" width="56" height="42" rx="6" fill="none" stroke="#0a1420" stroke-width="3"/>
    <line x1="310" y1="164" x2="342" y2="164" stroke="#0a1420" stroke-width="3" stroke-linecap="round"/>
    <line x1="310" y1="176" x2="330" y2="176" stroke="#0a1420" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
