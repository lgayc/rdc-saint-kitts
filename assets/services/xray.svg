<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-label="Digital X-Ray">
  <title>Digital X-Ray</title>

  <!-- Digital X-Ray
       Columna, tubo emisor arriba y detector abajo. El haz punteado
       en color es lo unico que se mueve entre los dos.

       Set de seis iconos con el mismo vocabulario: trazo de 6,
       extremos redondeados, tinta #0e1c28 para el equipo y
       #12a594 solo para lo que el equipo emite o mide. Un unico
       acento por icono; si se colorea todo, ninguno destaca.

       Nota para quien edite estos archivos: en XML esta PROHIBIDO
       poner dos guiones seguidos dentro de un comentario. Los seis
       archivos de esta carpeta estuvieron rotos por eso y el
       navegador no mostraba ninguno. -->

  <g fill="none" stroke="#0e1c28" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">

    <path d="M46 174V38"/>
    <path d="M30 174h32"/>
    <path d="M46 54h44"/>
    <rect x="88" y="42" width="42" height="26" rx="9"/>
    <path d="M109 68 78 130M109 68l31 62"
          stroke="#12a594" stroke-width="5" stroke-dasharray="1 11"/>
    <rect x="64" y="138" width="92" height="16" rx="8"/>
  </g>
</svg>
