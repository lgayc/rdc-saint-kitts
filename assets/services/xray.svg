<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Digital X-Ray">
  <!-- ============================================================
       DIGITAL X-RAY  ·  marca abstracta
       ------------------------------------------------------------
       Idea: un haz que baja y atraviesa una serie de lineas
       horizontales, que se van aclarando segun la "densidad".
       No dibuja un torax ni una maquina: sugiere la lectura por
       capas, que es lo que hace una radiografia.

       Todo el set comparte el mismo vocabulario: fondo claro,
       una figura grande centrada, un solo color de acento y
       mucho aire alrededor.
       ============================================================ -->
  <defs>
    <linearGradient id="xBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#12a594" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#12a594" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="340" fill="none"/>

  <!-- Haz -->
  <path d="M200 56 L296 246 L104 246 Z" fill="url(#xBeam)"/>

  <!-- Emisor -->
  <circle cx="200" cy="52" r="7" fill="#12a594"/>

  <!-- Capas atravesadas: el grosor y la opacidad bajan hacia
       el centro, como una lectura de densidades -->
  <g stroke="#0e1c28" stroke-linecap="round">
    <line x1="132" y1="126" x2="268" y2="126" stroke-width="9"  opacity="0.90"/>
    <line x1="122" y1="152" x2="278" y2="152" stroke-width="7"  opacity="0.55"/>
    <line x1="112" y1="178" x2="288" y2="178" stroke-width="10" opacity="0.85"/>
    <line x1="104" y1="204" x2="296" y2="204" stroke-width="5"  opacity="0.35"/>
    <line x1="98"  y1="228" x2="302" y2="228" stroke-width="8"  opacity="0.70"/>
  </g>

  <!-- Detector -->
  <rect x="92" y="256" width="216" height="10" rx="5" fill="#0e1c28" opacity="0.9"/>
</svg>
