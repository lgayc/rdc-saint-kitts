<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Digital X-Ray">
  <!-- ============================================================
       DIGITAL X-RAY
       Torax visto de frente: columna al centro y costillas a los
       lados, dentro del haz de rayos que baja desde el emisor.
       Para cambiar los colores, edita los valores de abajo.
       ============================================================ -->
  <defs>
    <linearGradient id="xrayBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#eef2f5"/>

  <!-- Haz de rayos -->
  <path d="M185 34 L215 34 L320 250 L80 250 Z" fill="url(#xrayBeam)"/>

  <!-- Emisor -->
  <rect x="176" y="16" width="48" height="20" rx="5" fill="#0a1420"/>
  <line x1="200" y1="8" x2="200" y2="16" stroke="#0a1420" stroke-width="4" stroke-linecap="round"/>

  <g fill="none" stroke="#0a1420" stroke-width="3.5" stroke-linecap="round">
    <!-- Columna vertebral -->
    <line x1="200" y1="92" x2="200" y2="222"/>
    <g stroke-width="2.4" opacity="0.55">
      <line x1="191" y1="108" x2="209" y2="108"/>
      <line x1="191" y1="130" x2="209" y2="130"/>
      <line x1="191" y1="152" x2="209" y2="152"/>
      <line x1="191" y1="174" x2="209" y2="174"/>
      <line x1="191" y1="196" x2="209" y2="196"/>
    </g>

    <!-- Costillas izquierdas -->
    <path d="M198 104 C168 104 138 122 132 150"/>
    <path d="M198 128 C164 128 132 148 126 178"/>
    <path d="M198 152 C166 152 138 172 134 200"/>
    <path d="M198 176 C172 176 150 192 146 214"/>

    <!-- Costillas derechas (espejo) -->
    <path d="M202 104 C232 104 262 122 268 150"/>
    <path d="M202 128 C236 128 268 148 274 178"/>
    <path d="M202 152 C234 152 262 172 266 200"/>
    <path d="M202 176 C228 176 250 192 254 214"/>
  </g>

  <!-- Claviculas -->
  <g fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round">
    <path d="M196 92 C176 84 154 84 140 92"/>
    <path d="M204 92 C224 84 246 84 260 92"/>
  </g>

  <!-- Detector -->
  <rect x="74" y="252" width="252" height="12" rx="6" fill="#0a1420" opacity="0.85"/>
</svg>
