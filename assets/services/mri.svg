<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-label="MRI">
  <title>MRI</title>

  <!-- MRI
       Tunel largo con la boca ovalada, que es lo que distingue una
       resonancia de un TAC. Dentro, las lineas del campo.

       Set de seis iconos con el mismo vocabulario: trazo de 6,
       extremos redondeados, tinta #0e1c28 para el equipo y
       #12a594 solo para lo que el equipo emite o mide. Un unico
       acento por icono; si se colorea todo, ninguno destaca.

       Nota para quien edite estos archivos: en XML esta PROHIBIDO
       poner dos guiones seguidos dentro de un comentario. Los seis
       archivos de esta carpeta estuvieron rotos por eso y el
       navegador no mostraba ninguno. -->

  <g fill="none" stroke="#0e1c28" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">

    <rect x="34" y="40" width="132" height="98" rx="32"/>
    <ellipse cx="100" cy="89" rx="27" ry="32"/>
    <path d="M86 78h28M84 89h32M86 100h28" stroke="#12a594" stroke-width="5"/>
    <path d="M44 166h112"/>
    <rect x="66" y="148" width="88" height="14" rx="7"/>
  </g>
</svg>
