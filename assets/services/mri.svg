<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="MRI">
  <!-- ============================================================
       MRI  ·  marca abstracta
       ------------------------------------------------------------
       Idea: cortes horizontales atravesando una forma ovalada.
       La resonancia entrega el cuerpo "en rebanadas"; se muestra
       eso, con un corte resaltado en acento.
       ============================================================ -->
  <defs>
    <clipPath id="mriShape">
      <ellipse cx="200" cy="170" rx="112" ry="96"/>
    </clipPath>
  </defs>

  <rect width="400" height="340" fill="none"/>

  <!-- Volumen -->
  <ellipse cx="200" cy="170" rx="112" ry="96" fill="#0e1c28" opacity="0.06"/>

  <!-- Cortes, recortados dentro del volumen -->
  <g clip-path="url(#mriShape)" stroke="#0e1c28" stroke-width="8" stroke-linecap="round">
    <line x1="70" y1="106" x2="330" y2="106" opacity="0.30"/>
    <line x1="70" y1="138" x2="330" y2="138" opacity="0.55"/>
    <line x1="70" y1="202" x2="330" y2="202" opacity="0.55"/>
    <line x1="70" y1="234" x2="330" y2="234" opacity="0.30"/>
  </g>

  <!-- Corte activo: se sale del volumen para marcar el foco -->
  <line x1="66" y1="170" x2="334" y2="170"
        stroke="#12a594" stroke-width="10" stroke-linecap="round"/>

  <!-- Contorno -->
  <ellipse cx="200" cy="170" rx="112" ry="96"
           fill="none" stroke="#0e1c28" stroke-width="9"/>

  <!-- Campo magnetico insinuado -->
  <g fill="none" stroke="#3b7fc4" stroke-width="4" opacity="0.35">
    <ellipse cx="200" cy="170" rx="140" ry="120"/>
  </g>
</svg>
